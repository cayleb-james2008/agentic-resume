<label class="aether-switch">
  <span class="aether-switch__copy">
    <span class="aether-switch__title">Prism overlay</span>
    <span class="aether-switch__sub">Chromatic glass on raised surfaces</span>
  </span>
  <span class="aether-switch__control">
    <input type="checkbox" class="aether-switch__input" checked="" />
    <span class="aether-switch__track" aria-hidden="true">
      <span class="aether-switch__on">On</span>
      <span class="aether-switch__off">Off</span>
      <span class="aether-switch__thumb"></span>
    </span>
  </span>
</label>
