<div class="aether-query">
  <label class="aether-query__label" for="aether-query-input"
    >Signal query</label
  >
  <div class="aether-query__control">
    <svg
      class="aether-query__icon"
      xmlns="http://www.w3.org/2000/svg"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"></path>
      <path d="M21 21l-6 -6"></path>
    </svg>
    <input
      id="aether-query-input"
      class="aether-query__input"
      type="text"
      placeholder="Enter coordinate or vector…"
    />
    <kbd class="aether-query__kbd">⌘K</kbd>
  </div>
  <span class="aether-query__hint">Telemetry · live index</span>
</div>
