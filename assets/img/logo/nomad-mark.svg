<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Nomad mark">
  <!-- minimal cyber-nomad: hood, torso, pack, terminal -->
  <circle cx="32" cy="32" r="30" stroke="#cba6f7" stroke-width="1.25" opacity=".35"/>
  <!-- hood -->
  <path d="M22 26c0-8 4.5-14 10-14s10 6 10 14c0 3-1 5.5-2.5 7.5" stroke="#cba6f7" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- face opening -->
  <path d="M26 28c1.5 4 4 6 6 6s4.5-2 6-6" stroke="#b4befe" stroke-width="1.4" stroke-linecap="round"/>
  <!-- eyes -->
  <circle cx="29.2" cy="27.2" r="1.1" fill="#cba6f7"/>
  <circle cx="34.8" cy="27.2" r="1.1" fill="#cba6f7"/>
  <!-- torso -->
  <path d="M24 36.5c2 8 5.5 14 8 14s6-6 8-14" stroke="#cba6f7" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- pack -->
  <path d="M40 34c4 .5 7 3 7 7.5S44 48 40 48.5" stroke="#b4befe" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M41 37.5h4.5M41 41h4.5M41 44.5h3" stroke="#cba6f7" stroke-width="1" stroke-linecap="round" opacity=".7"/>
  <!-- antenna -->
  <path d="M45.5 34.5l2-5" stroke="#f5c2e7" stroke-width="1.25" stroke-linecap="round"/>
  <circle cx="47.8" cy="28.8" r="1.2" fill="#f5c2e7"/>
  <!-- handheld terminal -->
  <rect x="17" y="38" width="9" height="12" rx="1.4" stroke="#cba6f7" stroke-width="1.5"/>
  <path d="M19.2 41h4.6M19.2 43.5h4.6M19.2 46h3.2" stroke="#b4befe" stroke-width="1" stroke-linecap="round"/>
</svg>
