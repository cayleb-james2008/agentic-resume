<div class="aether-toast" role="status">
  <span class="aether-toast__ribbon" aria-hidden="true"></span>
  <span class="aether-toast__icon" aria-hidden="true">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M13 3l0 7l6 0l-8 11l0 -7l-6 0l8 -11"></path>
    </svg>
  </span>
  <div class="aether-toast__body">
    <p class="aether-toast__title">Signal <em>acquired</em></p>
    <p class="aether-toast__text">
      Three new clusters indexed along the prism axis. Dossier A-1407 is ready
      for review.
    </p>
    <div class="aether-toast__meta">
      <span class="aether-toast__dot" aria-hidden="true"></span>
      14:02:18 UTC
    </div>
  </div>
  <button
    class="aether-toast__close"
    type="button"
    aria-label="Dismiss notification"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="14"
      height="14"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M18 6l-12 12"></path>
      <path d="M6 6l12 12"></path>
    </svg>
  </button>
</div>
